[project]
name = "tina-speech"
version = "0.1.0"
description = "Local-only microphone and wake-word pilot for TINA"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tina-meeting-voice",
    "numpy==2.4.6",
    "sherpa-onnx==2.0.1",
    "sounddevice==0.5.6",
    "sentencepiece==0.2.2",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.scripts]
tina-speech = "tina_speech.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tina_speech"]

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-asyncio==1.4.1.post1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
tina-meeting-voice = { path = "../../core/meetings/modules/voice-engine", editable = true }
