[project]
name = "tina-speech"
version = "0.1.0"
description = "Local-only microphone and wake-word pilot for TINA"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy==2.4.6",
    "sherpa-onnx==2.0.1",
    "sounddevice==0.5.6",
    "sentencepiece==0.2.2",
]

[project.scripts]
tina-speech = "tina_speech.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tina_speech"]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
