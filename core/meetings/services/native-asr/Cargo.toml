[package]
name = "tina-native-asr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = { version = "=1.13.8", path = "vendor/sherpa-onnx" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
