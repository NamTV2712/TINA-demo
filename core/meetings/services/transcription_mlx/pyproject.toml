[project]
name = "tina-transcription-mlx"
version = "0.1.0"
description = "Native Apple Silicon MLX/Metal ASR endpoint for TINA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "mlx-whisper>=0.4.3",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tina_transcription_mlx"]
