
name: TINA - Publish Speech Images to GHCR

on:
  push:
    branches:
      - aws-demo
    paths:
      - ".github/workflows/publish-tina-speech.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-speech:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - image: v012-gipformer
            context: .
            dockerfile: ./deploy/transcription/gipformer/Dockerfile

          - image: v012-viegem
            context: .
            dockerfile: ./deploy/transcription/viegem/Dockerfile

          - image: tts
            context: ./deploy/tts
            dockerfile: ./deploy/tts/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare GHCR owner
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Speech image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/tina-${{ matrix.image }}:aws-demo
            ghcr.io/${{ env.OWNER }}/tina-${{ matrix.image }}:sha-${{ github.sha }}
