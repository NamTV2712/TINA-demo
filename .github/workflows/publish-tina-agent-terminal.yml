
name: TINA - Publish Agent and Terminal

on:
  push:
    branches:
      - aws-demo
      - feat/tina-password-login
    paths:
      - ".github/workflows/publish-tina-agent-terminal.yml"
      - "clients/terminal/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image: v012-agent-api
            context: .
            dockerfile: ./core/agent/services/agent-api/Dockerfile

          - image: v012-agent-worker
            context: .
            dockerfile: ./core/agent/worker/Dockerfile

          - image: v012-terminal
            context: .
            dockerfile: ./clients/terminal/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image owner
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/tina-${{ matrix.image }}:${{ github.ref_name == 'feat/tina-password-login' && 'password-demo' || 'aws-demo' }}
            ghcr.io/${{ env.OWNER }}/tina-${{ matrix.image }}:sha-${{ github.sha }}
