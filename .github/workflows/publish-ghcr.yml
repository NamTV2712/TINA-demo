
name: TINA - Publish admin-api to GHCR

on:
  push:
    branches:
      - aws-demo
    paths:
      - ".github/workflows/publish-ghcr.yml"
      - "core/identity/services/admin-api/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-admin-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare GHCR image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tina-v012-admin-api" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin-api
        uses: docker/build-push-action@v6
        with:
          context: ./core/identity/services/admin-api
          file: ./core/identity/services/admin-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:aws-demo
            ${{ env.IMAGE }}:sha-${{ github.sha }}
