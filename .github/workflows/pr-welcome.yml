# pr-welcome — a one-time, friendly note for first-time contributors. This only posts a comment and
# fires only for a contributor's first PR so regulars aren't pinged. The merge bar is the
# merge-card gate (value + diff); this is hospitality, not enforcement.
name: pr-welcome

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write   # post one welcome comment; no code checkout (safe under pull_request_target)

jobs:
  welcome:
    # only a contributor's first interaction with the repo — don't nudge members/regulars
    if: ${{ contains(fromJSON('["FIRST_TIME_CONTRIBUTOR","FIRST_TIMER","NONE"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              `👋 Thanks for opening your first PR to TINA, @${context.payload.pull_request.user.login}!`,
              ``,
              `Please summarize what this change does and why. Include the verification you ran`,
              `and note any API, configuration, or deployment changes.`,
              ``,
              `Your PR is judged on its evidence — the observation bundle + the diff — not on whether you`,
              `show up. See CONTRIBUTING.md for the local development and contribution guidance.`,
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
