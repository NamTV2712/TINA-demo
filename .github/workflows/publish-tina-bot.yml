
name: TINA - Publish Bot to GHCR

on:
  push:
    branches:
      - aws-demo
    paths:
      - ".github/workflows/publish-tina-bot.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-bot:
    name: Build meet-join-env and tina-bot
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image names
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BASE_IMAGE=ghcr.io/${OWNER}/tina-meet-join-env" >> "$GITHUB_ENV"
          echo "BOT_IMAGE=ghcr.io/${OWNER}/tina-bot" >> "$GITHUB_ENV"

      - name: Free disk space on GitHub runner
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af
          df -h

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build meet-join-env
        shell: bash
        run: |
          docker build \
            -f core/meetings/modules/join/Dockerfile.env \
            -t tina/meet-join-env:dev \
            -t "$BASE_IMAGE:aws-demo" \
            -t "$BASE_IMAGE:sha-$GITHUB_SHA" \
            core/meetings/modules/join

      - name: Push meet-join-env to GHCR
        shell: bash
        run: |
          docker push "$BASE_IMAGE:aws-demo"
          docker push "$BASE_IMAGE:sha-$GITHUB_SHA"

      - name: Build TINA Bot
        shell: bash
        run: |
          docker build \
            --build-arg TINA_IMAGE_VERSION="${GITHUB_SHA:0:7}" \
            -f core/meetings/services/bot/Dockerfile \
            -t "$BOT_IMAGE:aws-demo" \
            -t "$BOT_IMAGE:sha-$GITHUB_SHA" \
            .

      - name: Push TINA Bot to GHCR
        shell: bash
        run: |
          docker push "$BOT_IMAGE:aws-demo"
          docker push "$BOT_IMAGE:sha-$GITHUB_SHA"

      - name: Verify published images
        shell: bash
        run: |
          docker image inspect "$BASE_IMAGE:aws-demo"
          docker image inspect "$BOT_IMAGE:aws-demo"
          echo "Both images built and published successfully."
