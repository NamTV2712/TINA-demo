{{- if .Values.adminApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tina.componentName" (list . "admin-api") }}
  labels:
    {{- include "tina.labels" . | nindent 4 }}
spec:
  type: {{ .Values.adminApi.service.type }}
  ports:
    - name: http
      port: {{ .Values.adminApi.service.port }}
      targetPort: http
  selector:
    {{- include "tina.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin-api
{{- end }}
