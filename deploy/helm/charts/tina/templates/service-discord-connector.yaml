{{- if .Values.discordConnector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tina.componentName" (list . "discord-connector") }}
  labels:
    {{- include "tina.labels" . | nindent 4 }}
spec:
  type: {{ .Values.discordConnector.service.type }}
  ports:
    - name: http
      port: {{ .Values.discordConnector.service.port }}
      targetPort: http
  selector:
    {{- include "tina.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: discord-connector
{{- end }}
