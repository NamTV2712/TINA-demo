[project]
name = "tina-livekit-pilot"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["livekit-agents==1.8.11", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
